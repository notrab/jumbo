name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

  examples:
    name: Build examples
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example: ["blog", "contact-form", "multilingual", "static-hosting", "bunny-sites", "bunny-optimizer"]

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Build
        run: vendor/bin/jumbo build

  release:
    name: Release
    needs: [test, examples]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Only feat, fix, perf and breaking changes release a version
          default_bump: false

      - name: Create release
        if: steps.tag_version.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag_version.outputs.new_tag }}
          NOTES: ${{ steps.tag_version.outputs.changelog }}
        run: gh release create "$TAG" --title "Release $TAG" --notes "$NOTES"
